[tool.poetry]
package-mode=false
name = "personify"
version = "0.1.0"
description = "A server developed keeping the user application domain in mind for high scalability"
authors = ["Nithin <gnknithin@gmail.com>"]
license = "GPL-3.0-Only"
readme = "README.md"
repository = "https://github.com/gnknithin/Personify-Service"
keywords = [
    "packaging",
    "poetry",
    "python3",
    "framework-agnostic",
    "reference-architecture",
    "microservice",
    "design-system",
    "event-driven-architecture",
    "domain-driven-design",
    "test-driven-development",
    "restful",
    "pytest",
    "testing",
    "api",
    "docker",
    "docker-compose",
    "design-patterns",
    "continuous-integration",
    "tornado",
]
classifiers = [
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Software Development :: Microservices Architecture :: Framework Agnostic",
]

[tool.poetry.dependencies]
python = "^3.8"
tornado = "^6.4.1"
python-dotenv = "^1.0.1"
aiotask-context = "^0.6.1"
logfmt = "^0.4"
marshmallow = "^3.21.3"

[tool.poetry.group.dev.dependencies]
pyclean = "^3.0.0"


[tool.poetry.group.test.dependencies]
pytest = "^8.2.2"
pytest-cov = "^5.0.0"
pytest-dotenv = "^0.5.2"


[tool.poetry.group.lint.dependencies]
mypy = "^1.10.1"
ruff = "^0.5.3"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
